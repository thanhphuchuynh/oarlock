components:
  schemas:
    Agent:
      type: object
      properties:
        connected:
          type: boolean
          description: Whether it is up.
        device_id:
          type: string
          description: The device holding the channel.
      required:
        - device_id
        - connected
    AgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
      required:
        - agents
    Device:
      type: object
      properties:
        allow_passthrough:
          type: boolean
          description: Mode A is permitted for this device. Half of a two-key switch; policy.allow_unrecorded is the other.
        connected:
          type: boolean
          description: Holding a control channel right now.
        enabled:
          type: boolean
          description: False means the device is revoked without being deleted.
          nullable: true
        id:
          type: string
          description: The device id, which is also the SSH username.
        keys:
          type: array
          description: The device's control-channel identity keys. A list, which is the whole rotation story.
          items:
            type: string
        mode:
          type: string
          description: An explicit reachability override, when set.
        platform:
          type: string
          description: android, linux, container or other. It picks the reachability default.
        profiles:
          type: array
          description: What this device may be asked to do. Empty means the gateway's default set.
          items:
            type: string
        resolved_mode:
          type: string
          description: persistent or dispatch, after the platform default is applied.
        retired_keys:
          type: array
          description: Keys that must no longer authenticate. Explicit, so revocation is auditable.
          items:
            type: string
        tags:
          type: object
          description: What authorizer selectors and record_input policy match on.
          additionalProperties:
            type: string
      required:
        - id
        - platform
        - resolved_mode
        - connected
    DeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last.
      required:
        - devices
    Problem:
      type: object
      description: RFC 9457. Every failure is one of these, and `type` is the machine-readable half — the closed set in pkg/condition, which the console renders a screen per.
      properties:
        detail:
          type: string
          description: What went wrong this time, when there is more to say.
        instance:
          type: string
          description: The resource this is about, when there is one.
        request:
          type: string
          description: The correlation id. Quote it when asking for help; it is in the gateway's logs against everything this request did.
        status:
          type: integer
          description: The HTTP status, repeated here.
        title:
          type: string
          description: One line, for a person.
        type:
          type: string
          description: A URI naming the condition. The stable part.
      required:
        - type
        - title
        - status
    Recording:
      type: object
      description: An asciicast with the manifest it was signed with. The manifest is here so a reader can verify the recording themselves rather than trusting this gateway's verdict on its own file.
      properties:
        cast:
          type: string
          description: The asciicast, as text.
        manifest:
          type: string
          format: byte
          description: The signed manifest, base64. Verify against the recorder's public key.
        verdict:
          $ref: '#/components/schemas/Verdict'
      required:
        - cast
        - verdict
    Session:
      type: object
      properties:
        attached_at:
          type: string
          format: date-time
          nullable: true
        bytes_dropped:
          type: integer
          description: Discarded by backpressure. Non-zero means the transcript has a hole in it.
        bytes_in:
          type: integer
          description: Operator to device.
        bytes_out:
          type: integer
          description: Device to operator.
        close_reason:
          type: string
          description: The closed set from ARCHITECTURE § 6.
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        device_id:
          type: string
          description: The device.
        exit_code:
          type: integer
          description: The process's exit status, where the profile has one.
          nullable: true
        id:
          type: string
          description: The session id. Recordings and audit events are keyed by it.
        live:
          type: boolean
          description: Still running, somewhere.
        live_here:
          type: boolean
          description: Still running on the node that answered. A session can be live in the ledger and not here.
        mode:
          type: string
          description: gateway or passthrough. A passthrough session is not recorded and cannot be.
        opened_by:
          type: string
          description: The service account, when a service acted for a human.
        principal:
          type: string
          description: Who opened it.
        profile:
          type: string
          description: shell, exec, log, file, tcp or sshpass.
        reason:
          type: string
          description: Why the session is in this state, where the state alone does not say.
        recording_state:
          type: string
          description: recorded or not_recorded. An unrecorded session is a queryable fact rather than a missing file.
        state:
          type: string
          description: waking, attached, closed…
        unattended:
          type: boolean
          description: A service session with no human subject, so robot and human activity can be counted apart.
      required:
        - id
        - device_id
        - profile
        - mode
        - principal
        - state
    SessionList:
      type: object
      properties:
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last.
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      required:
        - sessions
    Verdict:
      type: object
      description: 'This gateway''s own check of the recording. Worth printing and not evidence: the party that might have altered a recording is the party being asked.'
      properties:
        detail:
          type: string
        events_expected:
          type: integer
        events_found:
          type: integer
        last_good_checkpoint:
          type: integer
          description: Where the hash chain last agreed.
        ok:
          type: boolean
          description: Whether it verified.
        status:
          type: string
          description: ok, bad_signature, malformed, truncated…
      required:
        - status
        - ok
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'The token your authenticator issues. Never a query parameter: a query string ends up in ingress logs.'
