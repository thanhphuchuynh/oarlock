            type: string
        - name: until
          in: query
          description: 'Only sessions created before this instant, RFC 3339. Half-open together with `since`: `until` is exclusive, so two adjacent ranges never overlap and a boundary instant belongs to only one of them.'
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        "401":
          description: The credential was missing or refused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "429":
          description: Rate limited. `Retry-After` says how long.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "500":
          description: The gateway failed. `request` is the correlation id.
          content:
