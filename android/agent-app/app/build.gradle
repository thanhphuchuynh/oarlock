plugins {
    id "com.android.application"
}

android {
    namespace "dev.oarlock.agent"
    compileSdk 35

    defaultConfig {
        applicationId "dev.oarlock.agent"
        minSdk 26
        targetSdk 35
        versionCode (findProperty("versionCode") ?: "1").toString().toInteger()
        versionName (findProperty("versionName") ?: "0.1.0")

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files("libs/oarlockagent.aar")
}
