# The default Authorizer: principal → device selector → actions.
#
# It never returns an error, and that is what makes it a safe default: its source of
# truth is a file already in memory, so there is no outage in which it starts denying
# people. A file that fails to reload leaves the previous rules in place.

rules:
  # Everyone on call gets a shell on the treadmills.
  - principals: ["*@oncall.example.com", "admin@mail.com"]
    devices: ["treadmill-*"]
    actions: ["shell", "exec"]

  # A contractor, on a leash: fifteen minutes, and re-checked every ten seconds.
  - principals: ["contractor@partner.example.com"]
    devices: ["treadmill-4821"]
    actions: ["shell"]
    max_duration: 15m
    idle: 2m
    ttl: 10s

  # Narrowed to a target. `tcp`, `file:read`, `file:write` and `exec` name a specific
  # thing, so a grant can too: this one forwards the app's own port and nothing else,
  # and reads log files without reaching the rest of the file root.
  #
  # The device still holds its own allow-list underneath, and it has to — the gateway's
  # compromise is total, so the device's list is what holds when the gateway is lying.
  # What this buys is the fast lever: editing a rule here takes effect on the next
  # re-check, while changing the device's list is a fleet rollout.
  - principals: ["support@example.com"]
    devices: ["treadmill-*"]
    actions: ["tcp"]
    ports: [3000]
  - principals: ["support@example.com"]
    actions: ["file:read"]
    paths: ["logs/*"]
  - principals: ["support@example.com"]
    actions: ["exec"]
    commands: ["/bin/echo", "/usr/bin/uptime"]

  # A target constraint narrows a deny the same way it narrows an allow: this refuses
  # port 22 specifically, and says nothing about any other port.
  - principals: ["*"]
    actions: ["tcp"]
    ports: [22]
    deny: true
    reason: "the device's own sshd is not a forwarding target"

  # Auditors read recordings and watch live sessions. They never get a keyboard.
  - principals: ["auditor@example.com"]
    actions: ["replay", "observe"]

  # A carve-out. A matching deny beats every allow, wherever it appears in the file, so
  # it cannot be defeated by rule ordering somebody else controls.
  - principals: ["*"]
    tags: {pci_scope: "true"}
    actions: ["*"]
    deny: true
    reason: "PCI-scoped devices need a change ticket"
