# A working development gateway.
#
#   go build -o oarlockd ./cmd/oarlockd
#   go build -o oarlock-agent ./cmd/oarlock-agent
#   ./oarlockd -config examples/oarlock.yaml -check     # validate without starting
#   ./oarlockd -config examples/oarlock.yaml
#
# Unknown keys are refused rather than ignored: `allow_unrecoreded: true` that quietly
# stays false is a security setting somebody believes they set.

# Anything that is not dev or test gets the production checks, including an empty
# value — an unset environment must fail safe rather than open.
env: dev

# The address agents dial back on. **Not a load balancer**: an agent has to reach the
# replica the operator is waiting on (ADR-025), so this is the address of this process.
url: ws://127.0.0.1:8443

listen:
  ssh: "127.0.0.1:2222"
  http: "127.0.0.1:8443"
  # Required outside dev. `wss://` needs TLS, and a device-key handshake over `ws://`
  # is a handshake anybody on the path can watch.
  # tls_cert: /etc/oarlock/tls.crt
  # tls_key: /etc/oarlock/tls.key

ssh:
  # Every replica must present the same key. If they do not, operators get a
  # host-key-mismatch warning whenever a load balancer moves them — and an operator
  # trained to ignore that warning will ignore a real one.
  # Generate once, store as a secret, and mount the same bytes on every replica.
  host_key: ./hostkey
  # Dev only. The boot gate refuses a generated key in production, because a key that
  # changes on restart warns every operator every time.
  generate_host_key: true
  authorized_keys: ./authorized_keys
  # How long a connection may sit at the front door without an operator authenticating
  # on it. Both defaults are shown; neither normally needs changing.
  #
  # Raise the budget if your identity provider is slow — keyboard-interactive auth waits
  # on a human approving a login in a browser. Lower it only if you know every operator
  # uses a key. What it exists to stop is a peer holding a goroutine and a descriptor
  # open forever without proving who it is.
  handshake_budget: 15s
  # A ceiling on concurrent connections at the front door, authenticated or not. Set
  # generously: this is an operator door, and a cap that bites during an incident locks
  # out the person handling it. Negative disables the cap.
  max_connections: 1024

# The historical form reads a YAML registry and keeps session metadata beside recordings.
devices: ./devices.yaml

# Or let the admin API/UI add, update and delete devices in the operational DB.
# store:
#   kind: sqlite
#   path: ./oarlock.db
# devices:
#   kind: sqlite

# Who an operator is. Omit the block entirely to use ssh.authorized_keys and api.tokens,
# which is what a laptop wants and what production should not have: a static token is a
# long-lived shared secret and a key file makes revocation a file edit on every replica.
#
# auth:
#   kind: oidc
#   issuer: https://accounts.example.com     # discovery, and the issuer every token must name
#   client_id: oarlock-gateway
#   client_secret: ...                       # omit for a public client
#   scopes: [email, groups]                  # `openid` is always sent
#
#   # Which claim becomes the principal id — what gets recorded and what an authorisation
#   # rule matches. `email` by default, because rules are globs and people write
#   # `*@oncall.example.com`; an unverified email is then refused outright. Use `sub` where
#   # immutability matters more than legibility.
#   subject_claim: email
#   groups_claim: groups
#
#   # Setting this mounts the browser login at /auth/*, and the console shows a sign-in
#   # button instead of asking for a pasted token. Must be the exact URL registered with
#   # the provider, and https outside loopback.
#   redirect_url: https://gw.example.com/auth/callback
#
#   # How long a cached signing key may be used. This is the upper bound on how long a key
#   # the provider has *withdrawn* still verifies tokens.
#   jwks_refresh: 5m
#   # How long an SSH device-code login may sit unapproved.
#   device_timeout: 5m
#
# With this set, SSH offers keyboard-interactive: the gateway prints a URL and a short
# code, the operator approves in a browser that already holds their session and their
# second factor, and the shell opens. Nothing types a password into a terminal.
#
# api.tokens must be removed — a static secret next to an identity provider is simply the
# easier way in, and the gateway refuses to start with both.

authorizer:
  kind: rules
  path: ./rules.yaml
  # How many consecutive failed re-checks a live session survives before closing as
  # authz_unavailable. Omit for the default of 3; `grace: 0` is strict fail-closed,
  # which is the right setting where a session is more dangerous than an outage.
  # grace: 3
  recheck_interval: 30s
  # Break-glass administrators, by exact principal id.
  #
  # The policy store is edited through an API the policy store authorises, so on an
  # empty store nobody may write the first rule, and deleting the last
  # `admin:permissions` grant would lock the room. Whoever owns this file can always
  # get back in.
  #
  # It grants `admin:devices`, `admin:permissions` and `admin:kill` — and nothing else.
  # A config administrator can repair the policy; they cannot open a shell, watch a
  # session or query the database until they write themselves a grant, which is a
  # visible row and an audit line rather than a line in a file nobody re-reads.
  #
  # Exact ids only. A pattern here is refused at boot.
  admins:
    - admin@mail.com

# Optional. Required only for dispatch-mode devices that are not already connected over
# a persistent control channel.
# dispatcher:
#   kind: mqtt
#   url: mqtt://127.0.0.1:1883
#   topic: oarlock/devices/{device_id}/wake
#   client_id: oarlock-dev
#   qos: 1
#   timeout: 10s

recorder:
  # Empty records nothing — and says so in the operator's banner and in the session
  # row, because an unrecorded session must be a fact you can query for rather than an
  # absence somebody has to notice.
  dir: ./recordings
  signing_key: ./recording.key
  # Dev only: a recording signed by a key that changes on restart cannot be verified
  # afterwards, which is most of the point of signing it.
  generate_signing_key: true
  key_id: dev-recording-key

  # A bucket instead of a directory, so a recording is locked against the gateway's own
  # operator. Mutually exclusive with `dir` above — uncomment this and remove `dir`,
  # rather than setting both and letting a branch decide where the evidence went.
  #
  # lock_mode is a *request*. The store asks the bucket what it actually enforces and
  # reports that, so a bucket with no object lock reports `mutable` however this is
  # written — and the boot gate then refuses to start rather than signing an unchecked
  # immutability claim into every manifest. Object Lock has to be enabled when the
  # bucket is created; it cannot be turned on afterwards. See docs/plugins.md § 4.2.
  #
  # s3:
  #   bucket: oarlock-recordings
  #   region: eu-west-1
  #   endpoint: ""            # empty for AWS; host[:port] for MinIO, Ceph or Backblaze
  #   prefix: recordings      # <prefix>/<session-id>.cast and .manifest.json
  #   lock_mode: compliance   # compliance | governance | none
  #   retain_for: 2160h       # 90 days; required whenever a lock is asked for
  #   # Better left unset: credentials then come from the environment,
  #   # ~/.aws/credentials, or the instance's IAM role rather than from a file that
  #   # gets copied around. And keep signing_key somewhere this bucket's writers
  #   # cannot reach — whoever can rewrite a manifest can re-sign it.
  #   # access_key: ""
  #   # secret_key: ""
  #   # use_ssl: true         # only consulted when endpoint is a bare host

audit:
  # JSON lines on stderr by default. The queue is bounded: if it fills, events are
  # dropped and counted rather than blocking a session.
  kind: stderr
  buffer: 1024

api:
  # For development and CI. A real deployment uses an authenticator that can validate
  # a token it did not mint.
  tokens:
    dev-token-long-enough-for-the-check: admin@mail.com
  rate_per_minute: 120

policy:
  record_input:
    # Output is recorded when a recorder is configured. Input capture is a separate
    # per-session policy because PCI scope and employment/privacy law can point in
    # opposite directions.
    default: false
    rules:
      - name: pci capture
        when:
          device_tags: {pci_scope: "true"}
        value: true
      - authority: employment-law
        when:
          principal_groups: ["eu-*"]
        value: false

# Every limit here is server-side. A client-side limit is a suggestion. Omitting a key
# gets the documented default from ARCHITECTURE § 9.3 rather than Go's zero value — for
# a rate limit those are very different, because zero is not "unlimited", it is a stall.
limits:
  rate: 262144          # 256 KiB/s sustained, device → operator
  burst: 1048576        # absorbs a screen redraw
  batch: 65536          # ceiling on one coalesced DATA frame
  window: 25ms          # how long output may be held to batch it
  idle: 5m              # no traffic either way
  idle_input: 1h        # no operator input, even while output flows
  max_duration: 4h
  scrollback: 262144    # what a reattaching operator gets replayed
  sessions_per_device: 1
  sessions_per_principal: 5
